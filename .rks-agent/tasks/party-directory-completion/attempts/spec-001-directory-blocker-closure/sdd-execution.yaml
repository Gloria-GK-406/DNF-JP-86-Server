kind: rks-sdd-execution
controller: sdd-standard
contract:
  path: ./TaskContract.md
  revision: 1
current_stage: verification
state: complete
tasks:
  items:
  - id: TASK-01
    file: ./tasks/TASK-01-static-blocker-closure.md
    depends_on: []
    state: done
parent_controller: ../../multi-spec-map.md
artifacts:
  spec: ./spec.md
  result: ./spec-result.md
  plan: ./plan.md
  change_review: ./reviews/change-review.md
  completion_evidence: ./verification/completion-evidence.md
stages:
- id: spec
  reads: [contract]
  skills: [writing-specs]
  gate: none
  done_when: the Spec defines the evidence result and acceptance
  writes: [spec]
- id: plan
  reads: [contract, spec]
  skills: [writing-plans]
  gate: none
  done_when: the Plan covers conflicting-source reconciliation and reproducibility
  writes: [plan]
- id: implementation
  reads: [plan]
  skills: [executing-tasks]
  gate: auto
  done_when: all evidence and verdict artifacts are complete
- id: review
  reads: [contract, spec, plan]
  skills: [reviewing-work]
  gate: auto
  done_when: an independent review approves the complete evidence result
  writes: [change_review]
- id: verification
  reads: [contract, change_review]
  skills: [verification-before-completion]
  gate: auto
  done_when: fresh checks prove every success condition
  writes: [completion_evidence]
