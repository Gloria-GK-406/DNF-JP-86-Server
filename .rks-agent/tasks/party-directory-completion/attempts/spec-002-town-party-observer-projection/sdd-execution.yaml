kind: rks-sdd-execution
controller: sdd-standard
contract:
  path: ./TaskContract.md
  revision: 1
current_stage: verification
state: complete
tasks:
  items:
  - id: TASK-01
    file: ./tasks/TASK-01-domain-observer-plan.md
    depends_on: []
    state: done
  - id: TASK-02
    file: ./tasks/TASK-02-observer-delivery-and-stream.md
    depends_on:
    - TASK-01
    state: done
  - id: TASK-03
    file: ./tasks/TASK-03-entry-and-move-read-repair.md
    depends_on:
    - TASK-02
    state: done
  - id: TASK-04
    file: ./tasks/TASK-04-regression-docs-and-handoff.md
    depends_on:
    - TASK-03
    state: done
parent_controller: ../../multi-spec-map.md
artifacts:
  spec: ./spec.md
  result: ./spec-result.md
  plan: ./plan.md
  change_review: ./reviews/change-review.md
  completion_evidence: ./verification/completion-evidence.md
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: the Spec defines the requested result and evidence-based acceptance
  writes:
  - spec
- id: plan
  reads:
  - contract
  - spec
  skills:
  - writing-plans
  gate: none
  done_when: the ready task-unit Plan covers all requirements and checks
  writes:
  - plan
- id: implementation
  reads:
  - plan
  skills:
  - executing-tasks
  - test-driven-development
  gate: auto
  done_when: all task units are delivered with passing self-checks
- id: review
  reads:
  - contract
  - spec
  - plan
  skills:
  - reviewing-work
  gate: auto
  done_when: the complete result is independently approved
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves every success condition
  writes:
  - completion_evidence
