kind: rks-sdd-execution
controller: sdd-standard
contract:
  path: "./TaskContract.md"
  revision: 1
current_stage: verification
state: completed
artifacts:
  spec: "./spec.md"
  result: "./spec-result.md"
  change_review: "./reviews/change-review.md"
  completion_evidence: "./verification/completion-evidence.md"
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: spec defines audience, content boundary, and acceptance
  writes:
  - spec
- id: implementation
  reads:
  - spec
  skills:
  - executing-tasks
  gate: auto
  done_when: documentation or process artifact is complete
- id: review
  reads:
  - contract
  - spec
  skills:
  - reviewing-deliverables
  gate: auto
  done_when: configured domain review work is complete
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves accuracy and TaskContract success
  writes:
  - completion_evidence
tasks:
  active: null
  items:
  - id: TASK-01
    file: tasks/TASK-01-static-toolchain.md
    depends_on: []
    state: done
  - id: TASK-02
    file: tasks/TASK-02-scaffold-generation.md
    depends_on:
    - TASK-01
    state: done
  - id: TASK-03
    file: tasks/TASK-03-legacy-doc-integration.md
    depends_on:
    - TASK-02
    state: done
  - id: TASK-04
    file: tasks/TASK-04-enrichment-fanout.md
    depends_on:
    - TASK-02
    state: done
  - id: TASK-05
    file: tasks/TASK-05-regeneration-safety.md
    depends_on:
    - TASK-03
    - TASK-04
    state: done
  - id: TASK-06
    file: tasks/TASK-06-acceptance-evidence.md
    depends_on:
    - TASK-05
    state: done
