kind: rks-sdd-execution
controller: sdd-lite
contract:
  path: "./TaskContract.md"
  revision: 1
current_stage: verification
state: completed
parent_controller: "../../multi-spec-map.md"
artifacts:
  spec: "./spec.md"
  result: "./spec-result.md"
  change_review: "./reviews/change-review.md"
  completion_evidence: "./verification/completion-evidence.md"
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: spec defines audience, content boundary, and acceptance
  writes:
  - spec
- id: implementation
  reads:
  - spec
  skills:
  - executing-tasks
  gate: auto
  done_when: documentation or process artifact is complete
- id: review
  reads:
  - contract
  - spec
  skills:
  - reviewing-deliverables
  gate: auto
  done_when: the complete artifact is approved with no unresolved blocking findings
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves accuracy and TaskContract success
  writes:
  - completion_evidence
