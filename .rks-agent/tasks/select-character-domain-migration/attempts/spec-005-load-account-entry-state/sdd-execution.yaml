kind: rks-sdd-execution
controller: sdd-standard
contract:
  path: "./TaskContract.md"
  revision: 1
current_stage: verification
state: completed
artifacts:
  spec: "./spec.md"
  plan: "./plan.md"
  result: "./spec-result.md"
  change_review: "./reviews/change-review.md"
  completion_evidence: "./verification/completion-evidence.md"
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: spec covers TaskContract and every G4 row
  writes:
  - spec
- id: plan
  reads:
  - spec
  skills:
  - writing-plans
  gate: none
  done_when: plan maps every requirement and G4 slice
  writes:
  - plan
- id: implementation
  reads:
  - plan
  skills:
  - executing-tasks
  - test-driven-development
  gate: auto
  done_when: complete account entry feature and stable tests are complete
- id: review
  reads:
  - contract
  - spec
  - plan
  skills:
  - reviewing-code
  gate: auto
  done_when: complete change is approved
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves every condition
  writes:
  - completion_evidence
parent_controller: "../../multi-spec-map.md"
