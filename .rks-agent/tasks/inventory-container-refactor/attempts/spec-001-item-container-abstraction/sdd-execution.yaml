kind: rks-sdd-execution
controller: sdd-lite
contract:
  path: "./TaskContract.md"
  revision: 2
current_stage: verification
state: completed
parent_controller: "../../multi-spec-map.md"
artifacts:
  spec: "./spec.md"
  result: "./spec-result.md"
  change_review: "./reviews/change-review.md"
  completion_evidence: "./verification/completion-evidence.md"
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: spec fixes preserved behavior and structural goal
  writes:
  - spec
- id: implementation
  reads:
  - spec
  skills:
  - executing-tasks
  - test-driven-development
  gate: auto
  done_when: refactor is complete with behavior-preservation evidence
- id: review
  reads:
  - contract
  - spec
  skills:
  - reviewing-code
  gate: auto
  done_when: refactor is approved with no unresolved blocking findings
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves preserved behavior and TaskContract success
  writes:
  - completion_evidence
