kind: rks-sdd-execution
controller: sdd-lite
contract:
  path: "./TaskContract.md"
  revision: 1
current_stage: implementation
state: in_progress
parent_controller: "../../multi-spec-map.md"
artifacts:
  spec: "./spec.md"
  result: "./spec-result.md"
  change_review: "./reviews/change-review.md"
  completion_evidence: "./verification/completion-evidence.md"
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: spec covers the TaskContract
  writes:
  - spec
- id: implementation
  reads:
  - spec
  skills:
  - executing-tasks
  - test-driven-development
  gate: auto
  done_when: feature implementation and required tests are complete
- id: review
  reads:
  - contract
  - spec
  skills:
  - reviewing-code
  gate: auto
  done_when: complete change is approved with no unresolved blocking findings
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves every TaskContract success condition
  writes:
  - completion_evidence
