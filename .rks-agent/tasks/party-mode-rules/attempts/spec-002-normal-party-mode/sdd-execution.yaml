kind: rks-sdd-execution
controller: sdd-standard
contract:
  path: ./TaskContract.md
  revision: 3
current_stage: verification
state: completed
parent_controller: ../../multi-spec-map.md
tasks:
  items:
  - id: TASK-01
    file: ./tasks/TASK-01-normal-wire-and-lifecycle-evidence.md
    depends_on: []
    state: done
  - id: TASK-02
    file: ./tasks/TASK-02-normal-rules-and-leader-lifecycle.md
    depends_on:
    - TASK-01
    state: done
  - id: TASK-03
    file: ./tasks/TASK-03-protocol-projection-and-retirement-delivery.md
    depends_on:
    - TASK-02
    state: done
  - id: TASK-04
    file: ./tasks/TASK-04-live-evidence-docs-and-completion.md
    depends_on:
    - TASK-03
    state: done
artifacts:
  spec: ./spec.md
  result: ./spec-result.md
  plan: ./plan.md
  change_review: ./reviews/change-review.md
  completion_evidence: ./verification/completion-evidence.md
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: the Spec defines the requested result, scope, and evidence-based acceptance
  writes:
  - spec
- id: plan
  reads:
  - contract
  - spec
  skills:
  - writing-plans
  gate: none
  done_when: the ready Plan selects direct or task-units with complete coverage at the chosen resolution
  writes:
  - plan
- id: implementation
  reads:
  - plan
  skills:
  - executing-tasks
  gate: auto
  done_when: the chosen planning mode is delivered with usable Task plans and passing required self-checks when
    using units, and no remaining required high-level work
- id: review
  reads:
  - contract
  - spec
  - plan
  skills:
  - reviewing-work
  gate: auto
  done_when: the complete code, non-code, or mixed result is independently approved against the governing artifacts
    and actual output criteria
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves every TaskContract success condition
  writes:
  - completion_evidence
