kind: rks-sdd-execution
controller: sdd-governed
contract:
  path: "./TaskContract.md"
  revision: 1
current_stage: verification
state: completed
artifacts:
  spec: "./spec.md"
  spec_challenges: "./reviews/spec-challenges.md"
  spec_review: "./reviews/spec-review.md"
  plan: "./plan.md"
  plan_challenges: "./reviews/plan-challenges.md"
  plan_review: "./reviews/plan-review.md"
  change_challenges: "./reviews/change-challenges.md"
  change_review: "./reviews/change-review.md"
  completion_evidence: "./verification/completion-evidence.md"
  result: "./spec-result.md"
  drift_review: "./reviews/drift-review.md"
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: feature spec draft covers the TaskContract
  writes:
  - spec
- id: spec-adversarial
  reads:
  - contract
  - spec
  skills:
  - generating-adversarial-challenges
  gate: none
  done_when: credible challenges against the current feature spec are recorded
  writes:
  - spec_challenges
- id: spec-review
  reads:
  - contract
  - spec
  - spec_challenges
  skills:
  - reviewing-specs
  gate: auto
  done_when: spec challenges are adjudicated and the feature spec is approved
  writes:
  - spec_review
- id: plan
  reads:
  - spec
  skills:
  - writing-plans
  gate: none
  done_when: plan covers the approved feature spec
  writes:
  - plan
- id: plan-adversarial
  reads:
  - spec
  - plan
  skills:
  - generating-adversarial-challenges
  gate: none
  done_when: credible challenges against the current feature plan are recorded
  writes:
  - plan_challenges
- id: plan-review
  reads:
  - contract
  - spec
  - plan
  - plan_challenges
  skills:
  - reviewing-plans
  gate: auto
  done_when: plan challenges are adjudicated and the feature plan is approved
  writes:
  - plan_review
- id: implementation
  reads:
  - plan
  skills:
  - executing-tasks
  - test-driven-development
  - checking-plan-drift
  gate: auto
  done_when: Task Units are checked and final drift check is aligned
  writes:
  - drift_review
- id: change-adversarial
  reads:
  - spec
  - plan
  skills:
  - generating-adversarial-challenges
  gate: none
  done_when: credible challenges against the complete feature change are recorded
  writes:
  - change_challenges
- id: final-review
  reads:
  - contract
  - spec
  - plan
  - drift_review
  - change_challenges
  skills:
  - reviewing-code
  gate: auto
  done_when: change challenges are adjudicated and the complete feature is approved
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves every TaskContract success condition
  writes:
  - completion_evidence
tasks:
  items:
  - id: TASK-01
    file: ./tasks/TASK-01-authentication-core.md
    depends_on: []
    state: done
  - id: TASK-02
    file: ./tasks/TASK-02-game-ticket-login.md
    depends_on:
    - TASK-01
    state: done
  - id: TASK-03
    file: ./tasks/TASK-03-launcher-http-api.md
    depends_on:
    - TASK-01
    state: done
  - id: TASK-04
    file: ./tasks/TASK-04-server-end-to-end.md
    depends_on:
    - TASK-02
    - TASK-03
    state: done
  - id: TASK-05
    file: ./tasks/TASK-05-wpf-launcher.md
    depends_on:
    - TASK-03
    state: done
  - id: TASK-06
    file: ./tasks/TASK-06-runbook-and-assembly.md
    depends_on:
    - TASK-04
    - TASK-05
    state: done
