kind: rks-verification
decision: pass
claim: >-
  TASK-05 Execution Round 1 delivers the .NET 10 WPF launcher, strict single-BaseUrl
  configuration, transient credential flow, typed v1 HTTP client, retryable state machine,
  exact 35-slot A21 launch argument, and shell-free same-directory DNF.exe launch boundary.
conditions:
  - requirement: TDD and complete Launcher regression
    result: >-
      The deliberate RED failed 1/1 because the configuration parser still threw
      NotSupportedException. The final Release Launcher suite passed all 53 UnitTestResult
      entries with zero failed, skipped, or unclassified results. Coverage includes 19 INI
      cases, 3 preference cases, 6 HTTP cases, 10 argument/process cases, 7 ViewModel cases,
      and 8 independent visual-render cases.
    evidence:
      - task05-round1-red.log
      - task05-round1-red.trx
      - task05-round1-green.log
      - task05-round1-green.trx
  - requirement: AC-015 repeatable and live visual evidence
    result: >-
      Eight independent STA cases rendered login, register, loading, and error at actual
      RenderTargetBitmap metadata of 96 and 144 DPI. They produced 760x560 and 1140x840
      pixel PNGs respectively and asserted each state-specific named control was Visible,
      non-zero, inside the root bounds, and mutually exclusive with the other state panels.
      All 8 passed. The controller manually inspected every fresh PNG as complete and
      unclipped. A separate real Release EXE smoke at the machine's unchanged AppliedDPI=168
      showed accessible login/register/account/password/action controls and was closed.
    evidence:
      - task05-visual-render.log
      - task05-visual-render.trx
      - task05-login-96dpi.png
      - task05-login-144dpi.png
      - task05-register-96dpi.png
      - task05-register-144dpi.png
      - task05-loading-96dpi.png
      - task05-loading-144dpi.png
      - task05-error-96dpi.png
      - task05-error-144dpi.png
      - task05-live-login-current-dpi.png
  - requirement: RQ-014 secret and process-argument safety
    result: >-
      The static sentinel found 11 event-log calls, all fixed literal lifecycle codes; no
      Console, Debug, Trace, ILogger, file-append, or StreamWriter logging sink; no
      ProcessStartInfo.Arguments assignment; one ArgumentList entry with UseShellExecute
      false; preferences fields limited to loginId and remember; no PasswordBox binding and
      four explicit clear sites; and only BaseUrl in Launcher.ini.example. Runtime tests also
      prove password/ticket/full-argument sentinels do not enter captured lifecycle logs,
      preferences, safe errors, or additional process arguments.
    evidence:
      - task05-security-sentinel.log
      - task05-round1-green.log
      - task05-round1-green.trx
  - requirement: Release build, artifacts, and cleanup
    result: >-
      Server/86JP.Server.slnx built in Release with zero warnings and zero errors after the
      final product and test changes. git diff --check exited zero. No Dfo.Launcher process
      remained after the live smoke. The 23-file Launcher product/test/props plus solution
      manifest is A74932BEA5AC1B1FF18F2A8AB606B1D02717B2E785FBA631DA6BA6F5FBF21A7E.
    evidence:
      - task05-round1-solution-build.log
