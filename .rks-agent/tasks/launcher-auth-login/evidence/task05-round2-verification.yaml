kind: rks-verification
decision: pass
claim: >-
  TASK-05 Execution Round 2 closes independent review QR1-F1 through QR1-F3:
  credentials cannot cross automatic redirects, the configured deadline covers send plus
  both success and error bodies while caller cancellation remains distinct, and API field
  errors stay visible in an editable form that can be resubmitted immediately.
conditions:
  - requirement: QR1-F1 redirect credential boundary
    result: >-
      Before the fix, the two real Kestrel 307/308 cases reached the redirect behavior and
      returned the wrong client outcome. The production factory now creates an
      HttpClientHandler with AllowAutoRedirect=false and maps every 3xx to the stable safe
      redirect_not_allowed result. After the fix both cases passed: the initial loopback
      Kestrel received exactly one request, a second real Kestrel received zero requests and
      no password body, and a normal loopback bootstrap through the same default factory
      still succeeded.
    evidence:
      - task05-round2-red.log
      - task05-round2-red.trx
      - task05-round2-green.log
      - task05-round2-green.trx
  - requirement: QR1-F2 whole-operation deadline and caller cancellation
    result: >-
      The RED success-200 and error-503 cases returned headers immediately and supplied a
      concrete StreamContent whose asynchronous body read stalled until its token was
      cancelled. Both exceeded the configured 150 ms deadline and failed only when the
      independent two-second caller watchdog fired. The client now creates one linked
      deadline token per operation and passes it to SendAsync, success JSON reads, and error
      JSON reads. GREEN returned request_timeout within the bounded interval for both status
      classes, then completed a second request successfully. A separate stalled-body case
      proves caller cancellation still propagates as OperationCanceledException and also
      permits a successful retry.
    evidence:
      - task05-round2-red.log
      - task05-round2-red.trx
      - task05-round2-green.log
      - task05-round2-green.trx
  - requirement: QR1-F3 editable and visible field errors
    result: >-
      RED reproduced State=Error and the missing named field-error element. The ViewModel now
      keeps State=Ready only when fieldErrors are present, leaves the form visible, publishes
      the ordered field text, and returns CanSubmit after the operation gate releases; errors
      without fieldErrors still use Error/Retry. GREEN proves editing the login id and an
      immediate second submit succeeds. A real MainWindow binding/layout test proves the
      field text, form, input and enabled action are actually visible and editable.
    evidence:
      - task05-round2-red.log
      - task05-round2-red.trx
      - task05-round2-green.log
      - task05-round2-green.trx
  - requirement: complete regression, visuals, build, and safety
    result: >-
      Every one of 59 Release Launcher UnitTestResult entries passed with no failed, skipped,
      or unclassified result. The unchanged four-state 96/144 DPI visual matrix passed 8/8
      and regenerated the verified PNG set. Server/86JP.Server.slnx built with zero warnings
      and zero errors. The updated static sentinel passed redirect, whole-body deadline,
      fixed-code logging, preferences, PasswordBox, INI and shell-free single-argument
      invariants. git diff --check exited zero and no Dfo.Launcher process remained. The
      current 23-file manifest is
      10CC898725A7556206092A0A82EB3A1ADFB24824DDAA1871AA8A83EBBDB1BD29.
    evidence:
      - task05-round2-full.log
      - task05-round2-full.trx
      - task05-round2-visual.log
      - task05-round2-visual.trx
      - task05-round2-solution-build.log
      - task05-round2-security-sentinel.log
