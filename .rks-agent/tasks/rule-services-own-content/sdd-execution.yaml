kind: rks-sdd-execution
controller: sdd-standard
contract:
  path: "./TaskContract.md"
  revision: 2
current_stage: verification
state: completed
artifacts:
  spec: "./spec.md"
  plan: "./plan.md"
  result: "./spec-result.md"
  change_review: "./reviews/change-review.md"
  completion_evidence: "./verification/completion-evidence.md"
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: hitl
  done_when: spec fixes preserved behavior and structural goal
  writes:
  - spec
- id: plan
  reads:
  - spec
  skills:
  - writing-plans
  gate: hitl
  done_when: plan sequences refactor steps and behavior-preservation checks
  writes:
  - plan
- id: implementation
  reads:
  - plan
  skills:
  - executing-tasks
  - test-driven-development
  gate: auto
  done_when: planned refactor is complete with behavior-preservation evidence
- id: review
  reads:
  - contract
  - spec
  - plan
  skills:
  - reviewing-code
  gate: auto
  done_when: refactor is approved with no unresolved blocking findings
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves preserved behavior and TaskContract success
  writes:
  - completion_evidence
tasks:
