kind: rks-sdd-execution
controller: sdd-standard
contract:
  path: ./TaskContract.md
  revision: 2
parent_controller: E:\Project\DNF\DNF-JP-86-Server\.worktrees\reactive-dungeon-lifecycle\.rks-agent\tasks\reactive-dungeon-lifecycle\multi-spec-map.md
current_stage: completed
state: completed
artifacts:
  spec: ./spec.md
  result: ./spec-result.md
  diagnosis: ./diagnosis.md
  plan: ./plan.md
  change_review: ./reviews/change-review.md
  completion_evidence: ./verification/completion-evidence.md
stages:
- id: spec
  reads:
  - contract
  skills:
  - writing-specs
  gate: none
  done_when: the Spec defines the requested result, scope, and evidence-based acceptance
  writes:
  - spec
- id: diagnosis
  reads:
  - contract
  - spec
  skills:
  - systematic-debugging
  gate: auto
  done_when: the original failure is reproduced or its reproduction limit is evidenced, and a supported cause plus
    regression target are recorded before repair planning; this is a diagnosis-only call with no production fix
  writes:
  - diagnosis
- id: plan
  reads:
  - contract
  - spec
  - diagnosis
  skills:
  - writing-plans
  gate: none
  done_when: the ready direct or task-units Plan derives the repair from diagnosis, preserves unaffected behavior,
    and defines original-failure regression checks
  writes:
  - plan
- id: implementation
  reads:
  - spec
  - plan
  - diagnosis
  skills:
  - executing-tasks
  gate: auto
  done_when: the chosen planning mode is delivered with usable Task plans and passing required self-checks when
    using units, and no remaining required high-level work; evidence checks the original failure and protected behavior
    after the fix
- id: review
  reads:
  - contract
  - spec
  - plan
  - diagnosis
  skills:
  - reviewing-work
  gate: auto
  done_when: the complete code, non-code, or mixed result is independently approved against the governing artifacts
    and actual output criteria
  writes:
  - change_review
- id: verification
  reads:
  - contract
  - change_review
  skills:
  - verification-before-completion
  gate: auto
  done_when: fresh evidence proves every TaskContract success condition
  writes:
  - completion_evidence
