[ServerRedirect]
; Set to 1 when the game client and server run on different machines.
Enabled=1
Address=100.100.51.178

[Diagnostics]
; Reserved for captured game-log hooks.
GameLogEnabled=0

[B1Guard]
; How long a worker thread waits for the client thread to publish the singleton
; at 0x03091FB8 before the guard gives up and skips the call it would otherwise
; fault on. Only reached on the B1 replay, whose dump snapshot predates that
; construction. 0 disables waiting (skip only).
SingletonWaitMs=5000

[FrameCapture]
; NetworkHook frame recorder. One JSON line per Game packet, both directions.
Enabled=1
; Hex message types to record, or * for every type. Example: Types=00AB,01DD
Types=*
; Hex message types to record a call stack for (send stacks locate the builder),
; or * for every type, or empty for none.
Stack=*
; Cap on hex-dumped bytes per frame; 0 means unlimited.
MaxBodyBytes=4096
; Also trace every ISocket::Write staging call to clienthack-write-trace.log.
; Noisy, but it maps a staged body back to the caller that produced it.
WriteTrace=1
LogFile=clienthack-frame-capture.log
