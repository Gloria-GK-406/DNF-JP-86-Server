[ServerRedirect]
; Set to 1 when the game client and server run on different machines.
Enabled=1
Address=100.100.51.178

[Diagnostics]
; Reserved for captured game-log hooks.
GameLogEnabled=0

[MultiInstance]
; Rename the client's known singleton mutexes and hide other DNF windows from
; its startup probes. Keep enabled in both protocol client directories.
Enabled=1

[B1Guard]
; The guard stops the client's crash reporter from faulting on the singleton at
; 0x03091FB8 that early startup has not built yet. That fault is secondary: the
; reporter only runs because a PRIMARY fault already occurred, which the client's
; own exception filter swallows -- the plugin's first-chance records in
; clienthack-b1-guard.log are where that primary fault is visible.
; Waiting for the singleton is therefore pointless (the process is already
; unwinding), so 0 = skip immediately. Nonzero waits that many ms first.
SingletonWaitMs=0

[PageGuardTrace]
; Which pages of the protector's own sections does the client actually touch,
; and who touches them? Every page of every listed section is marked PAGE_GUARD;
; the first access to a page is recorded and then allowed to proceed, so the
; client behaves exactly as it would unarmed. One hit per page, by design.
;
; This exists because dropping a section and seeing whether the client survives
; is a bad instrument: it costs a launch per hypothesis, says nothing about what
; the section holds, and lies about anything on a rare path -- sections 4, 7 and
; 9 each passed that test once and failed it once.
;
; Off by default: it is a measurement run, not a play setting.
Enabled=0
; Section INDICES (not names -- three sections are called .rsrc and two .bss).
; 4=.X?9 5=.rsrc 6=.tls 7=.bss/vmp0 8=.rsrc/vmp1 9=.bss 10=.mackt 11=.,_W
; Empty selects nothing. Narrow the list to bisect if a section turns out to be
; a system-call buffer, where a guard makes the call fail instead of faulting.
Sections=4,5,6,7,8,9,10,11
; Hold the guards back until every plugin has installed its hooks and
; patches. The host validates a hook's expected bytes with a kernel-side
; read, and a kernel probe of a guarded page fails outright instead of
; raising in user mode -- arming during init made NetworkHook's hook at
; RVA 0x048FF9AB (inside section 8) fail and took the whole host down.
; Touches before the deadline are missed; the arm time is in the log.
; The number is load-bearing, and the safe value is startup-dependent. At 2000
; the client faulted at startup (a near-null write from a DLL: a call that
; failed because a kernel probe hit a guarded page, then went unchecked). At
; 8000 it was fine on one boot and hung the client on the next. 30000 clears
; startup entirely on both. Startup pages are then missed -- capture those in
; a separate short-delay run rather than by lowering this.
ArmDelayMs=30000
LogFile=clienthack-pageguard.log

[A21PickupTrace]
; 0050_A21RuntimeFix only. Capture inbound/outbound 0x0027 and 0x002B bodies
; beside DNF.exe in clienthack-a21-pickup-trace.log. Restart the client to apply.
Enabled=0

[FrameCapture]
; NetworkHook frame recorder. One JSON line per Game packet, both directions.
Enabled=1
; Hex message types to record, or * for every type. Example: Types=00AB,01DD
Types=*
; Hex message types to record a call stack for (send stacks locate the builder),
; or * for every type, or empty for none.
Stack=*
; Cap on hex-dumped bytes per frame; 0 means unlimited.
MaxBodyBytes=4096
; Also trace every ISocket::Write staging call to clienthack-write-trace.log.
; Noisy, but it maps a staged body back to the caller that produced it.
WriteTrace=1
LogFile=clienthack-frame-capture.log

[ReadTrace]
; Field-level decomposition of inbound frames. FrameCapture records the bytes;
; this records where the client cut them into fields -- one JSON line per frame,
; listing every inbound read as {off, width, value, calling RVA}.
;
; It exists because the static walk cannot answer this for most notifications:
; it dies wherever a handler's call graph enters the packed region. The four
; read primitives are the only way bytes leave the inbound stream, so packed
; code has to call them too, and hooking them sidesteps the obfuscation
; entirely.
;
; Off by default, and the hooks are not even installed when off: the scalar
; reads have over a thousand call sites and sit on the receive layer's hottest
; path. Turn it on for a session that is investigating a layout, then turn it
; back off.
Enabled=0
; Hex message types to trace, or * for every type. Narrow this: * on a
; select-character batch produces tens of thousands of records.
; Example: Types=0004,0002
Types=*
LogFile=clienthack-read-trace.log
