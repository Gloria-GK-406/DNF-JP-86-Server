name: Server E2E (real-client baselines)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-e2e-local-pvf
  cancel-in-progress: false
jobs:
  formal-e2e:
    name: Formal E2E readiness (real-client samples required)
    runs-on: [self-hosted, Linux, X64, dnf-e2e]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify evidence and reporting guards
        run: python3 -m unittest discover -s Tool/E2E -p 'test_*.py' -v
      - name: Verify committed E2E materials
        run: python3 Tool/E2E/scene.py --verify-only
      - name: Require approved real-client baseline
        run: python3 Tool/E2E/run.py --out artifacts/e2e/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Formal E2E readiness summary
        if: always()
        run: |
          if test -f artifacts/e2e/${{ github.run_id }}-${{ github.run_attempt }}/summary.md; then
            cat artifacts/e2e/${{ github.run_id }}-${{ github.run_attempt }}/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Formal E2E was not executed; no readiness report is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain formal readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-e2e-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/e2e/**/results.json
            artifacts/e2e/**/junit.xml
            artifacts/e2e/**/summary.md
          if-no-files-found: warn
          retention-days: 14
