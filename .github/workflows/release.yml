name: Server Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main history
        id: tag
        run: python Tool/Release/release.py verify-tag
  validate:
    needs: guard
    uses: ./.github/workflows/validate.yml
    with:
      package: true
      version: ${{ needs.guard.outputs.version }}
  publish:
    needs: [guard, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-*
          path: packages
          merge-multiple: true
      - name: Publish verified packages
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum --check *.sha256
          # Never overwrite an existing release/version. A failure can be retried after
          # inspecting and deleting its draft; published assets remain immutable by convention.
          args=(--verify-tag --generate-notes --draft --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" ./*
          gh release edit "$RELEASE_TAG" --draft=false
