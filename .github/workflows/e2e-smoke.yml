name: Server infrastructure smoke (local PVF)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # The production channel script has fixed ports. One lane per physical runner.
  group: server-e2e-local-pvf
  cancel-in-progress: false
jobs:
  e2e:
    name: Synthetic infrastructure smoke (not formal E2E)
    runs-on: [self-hosted, Linux, X64, dnf-e2e]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Local toolchain and fixture
        run: |
          set -euo pipefail
          test -x "$HOME/dnf-e2e/dotnet/dotnet"
          echo "$HOME/dnf-e2e/dotnet" >> "$GITHUB_PATH"
          python3 Tool/E2E/scene.py --verify-only
          echo "PVF_ARCHIVE_PATH=$GITHUB_WORKSPACE/TestAssets/E2E/a21-initial-v1/Script.pvf" >> "$GITHUB_ENV"
          python3 -c 'import json,os; m=json.load(open("TestAssets/E2E/a21-initial-v1/manifest.json")); open(os.environ["GITHUB_ENV"],"a").write("PVF_SHA256="+m["files"]["Script.pvf"]["sha256"]+"\n")'
          echo "E2E_OUT=artifacts/smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Verify E2E report guards
        run: python3 -m unittest discover -s Tool/E2E -p 'test_*.py' -v
      - name: Build production Host
        run: dotnet build Server/src/Dfo.Server.Host/Dfo.Server.Host.csproj -c Release -p:ContinuousIntegrationBuild=true
      - name: Synthetic smoke checks (excluded from formal coverage)
        run: python3 Tool/Smoke/run.py --out "$E2E_OUT"
      - name: Infrastructure smoke summary
        if: always()
        run: |
          if test -n "${E2E_OUT:-}" && test -f "$E2E_OUT/summary.md"; then
            cat "$E2E_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Infrastructure smoke did not run: toolchain, fixture, guard or build failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain infrastructure smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infrastructure-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          # PVF, credentials and SQLite files stay on the local machine.
          path: |
            artifacts/smoke/**/results.json
            artifacts/smoke/**/junit.xml
            artifacts/smoke/**/summary.md
            artifacts/smoke/**/frames.jsonl
            artifacts/smoke/**/state-*.json
            artifacts/smoke/**/host-*.log
            artifacts/smoke/**/failure.txt
          if-no-files-found: warn
          retention-days: 14
