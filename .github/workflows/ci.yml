name: Server CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: socket-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-networking:
    name: Windows networking regression
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: true
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Restore networking tests
        run: dotnet restore Server/tests/Dfo.Server.Networking.Tests/Dfo.Server.Networking.Tests.csproj
      - name: Run Windows networking regression
        run: dotnet test Server/tests/Dfo.Server.Networking.Tests/Dfo.Server.Networking.Tests.csproj -c Release --no-restore --logger trx --results-directory artifacts/windows-networking-results --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: Retain regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-networking-regression
          path: artifacts/windows-networking-results
          if-no-files-found: warn
          retention-days: 7
